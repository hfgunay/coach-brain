[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coach-brain-server"
version = "0.3.0"
description = "Study coach server that exposes an avenoxbeyin vault as a remote MCP connector"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "uvicorn[standard]>=0.30",
    "starlette>=0.40",
    "pillow>=10",
    "python-multipart>=0.0.9",
    "wsgidav>=4.3,<5",
    "a2wsgi>=1.10",
    "tzdata",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
coach-server = "coach.server:main"

[tool.setuptools]
packages = ["coach"]

[tool.setuptools.package-data]
coach = ["skill/SKILL.md", "skill/exams/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
